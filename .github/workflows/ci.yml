name: CI and Windows desktop build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Static bytecode checks
        run: python -m compileall -q app
      - name: Unit tests
        run: python -m pytest -q
      - name: Windows UI smoke test
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from app.ui import Window; from pathlib import Path; import tempfile; app=QApplication([]); d=tempfile.TemporaryDirectory(); w=Window(Path(d.name)); assert w.windowTitle(); w.close(); d.cleanup()"

  windows-exe:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and packager
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build desktop executable (local AI optional)
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name GuiaLankaPhotoManager --collect-submodules PySide6 --collect-submodules PIL launch.py
      - name: Upload unsigned Windows build
        uses: actions/upload-artifact@v4
        with:
          name: GuiaLankaPhotoManager-Windows-unsigned
          path: dist/GuiaLankaPhotoManager/
          retention-days: 14
